[workspace]
resolver = "2"
members = ["crates/mm-core", "crates/mm-asm", "crates/mm-cli", "crates/mm-app"]


[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
# overflow-checks stays off in release: the M0 performance gate is 50M instructions/second
# and the VM is written with explicit wrapping_*/saturating_* everywhere (hard rule 3).
# The debug-profile fuzz run exercises the same code with overflow checks on.
#
# Line tables, so `perf record` names a function instead of an address. `debug = 1` is line
# tables without full DWARF: it changes no codegen and costs only binary size, which matters
# here because the thing being profiled has to be the thing that ships. A profile taken against
# a differently-optimised build is a profile of a different program.
debug = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = 1
