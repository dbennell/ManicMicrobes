name: Release

# Three native builds and a release, because cross-compiling a macOS universal
# binary from a Linux desktop is the part that hurts and a runner per platform
# makes it three ordinary `cargo build`s.
#
#   push a v* tag        build, test, and publish a release
#   run it by hand       build and test only, artefacts attached to the run
#
# The version comes from the tag, so what the release is called is decided when
# it is cut rather than here. A tag with a hyphen in it — v0.1.0-rc.1 — is
# published as a prerelease.
#
# The binaries are unsigned, deliberately: signing them costs an Apple developer
# account and a Windows certificate every year, which is not what this project
# is for. The cost is a Gatekeeper prompt and a SmartScreen warning, and the way
# round each is in the release notes rather than left as a surprise.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Windows runners default to PowerShell. One shell everywhere means one
    # packaging script rather than three.
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # The gate. Not the full suite — that is four evolutionary acceptance runs and
  # the better part of an hour. `cargo fast` is every unit test, the totality
  # fuzz, the hard-rule guards and the determinism suite.
  # ---------------------------------------------------------------------------
  check:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      # First, because it costs a second and everything below it costs twenty minutes.
      #
      # The archive names, the macOS `Info.plist` and the release title all take their number
      # from the *tag*; the binary's own version is `CARGO_PKG_VERSION`, which comes from
      # `Cargo.toml` and is what `mm-app` puts on screen. Ship those apart and the download is
      # called one thing and calls itself another.
      #
      # `v0.1.0`'s tag message — "a tag that disagrees with Cargo.toml ships the wrong number"
      # — has been the rule since the first release and was enforced by remembering. This is
      # the rule with teeth.
      #
      # Exact equality, including any prerelease suffix: a `v0.3.0-rc.1` tag wants
      # `version = "0.3.0-rc.1"` in the workspace, because that is the number the binary in
      # that archive will report.
      - name: The tag agrees with Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Ask cargo rather than reading the file, so that a crate overriding the inherited
          # `[workspace.package] version` cannot hide here.
          mapfile -t crates < <(
            cargo metadata --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u
          )
          if [[ ${#crates[@]} -ne 1 ]]; then
            echo "::error::the workspace crates disagree on their version: ${crates[*]}"
            exit 1
          fi
          if [[ "$tag" != "${crates[0]}" ]]; then
            echo "::error::tag is v${tag} but Cargo.toml says ${crates[0]}"
            echo "Bump [workspace.package] version to ${tag}, commit, and put the tag on that"
            echo "commit — the bump comes first and the tag goes on it. Never move a tag that"
            echo "has already been pushed."
            exit 1
          fi
          echo "v${tag} matches Cargo.toml"

      - name: cargo fast
        run: cargo fast --locked

      # Separate because `fast` is mm-core and mm-asm. This one proves the build script can still
      # include the icon module, which is otherwise only discoverable on the Windows runner, two
      # jobs and eight minutes later.
      - name: The build script can still include the icon
        run: cargo build-include --locked

  # ---------------------------------------------------------------------------
  # One archive per platform. Each carries both binaries, the scenarios and the
  # genomes they need, and both licences.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      # A macOS failure should not hide whether Windows built.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            name: macos-universal
            archive: zip
          - os: windows-latest
            name: windows-x86_64
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      # Defender scans every object file rustc writes, and this graph is around 670 crates: the
      # first Windows build that got all the way through took eighty minutes against a few for
      # Linux. Excluding the workspace and the two cargo directories is the standard fix and
      # changes nothing about what comes out — only what reads each file on the way past.
      #
      # Never fatal, and never `set -e`. If a future image has Defender under policy and refuses,
      # the build should be slow rather than broken, so each exclusion is attempted on its own and
      # a refusal is printed rather than raised.
      - name: Let rustc write files without them being scanned
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup")) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
              Write-Host "excluded path $path"
            } catch {
              Write-Host "could not exclude $path : $($_.Exception.Message)"
            }
          }
          foreach ($process in @('rustc.exe', 'cargo.exe', 'link.exe')) {
            try {
              Add-MpPreference -ExclusionProcess $process -ErrorAction Stop
              Write-Host "excluded process $process"
            } catch {
              Write-Host "could not exclude $process : $($_.Exception.Message)"
            }
          }

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # A hand-run build is not a release and must not look like one.
            version="0.0.0-dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      # `--locked` on every build: Cargo.lock is committed, and a release that
      # silently resolved a different dependency graph is not the thing that was
      # tested two jobs ago.
      - name: Build
        if: matrix.name != 'macos-universal'
        run: |
          cargo build --release --locked -p mm-cli
          cargo build --release --locked -p mm-app --features render

      # macos-latest is Apple silicon, so x86_64 is the one that needs adding.
      # Two builds and a lipo is the whole of "universal".
      - name: Build both architectures and fuse them
        if: matrix.name == 'macos-universal'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" -p mm-cli
            cargo build --release --locked --target "$target" -p mm-app --features render
          done
          mkdir -p target/release
          for binary in mm-cli mm-app; do
            lipo -create -output "target/release/$binary" \
              "target/aarch64-apple-darwin/release/$binary" \
              "target/x86_64-apple-darwin/release/$binary"
            lipo -info "target/release/$binary"
          done

      - name: Stage the archive
        run: |
          version="${{ steps.version.outputs.version }}"
          dir="manic-microbes-${version}-${{ matrix.name }}"
          exe=""
          [[ "$RUNNER_OS" == "Windows" ]] && exe=".exe"

          mkdir -p "dist/$dir"
          cp "target/release/mm-app$exe" "dist/$dir/"
          cp "target/release/mm-cli$exe" "dist/$dir/"

          # A scenario is a recipe and a genome is a seed: without both, `run`
          # has nothing to put on the slide.
          cp -R scenarios genomes "dist/$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$dir/"

          echo "STAGE_DIR=$dir" >> "$GITHUB_ENV"

      # macOS shows the dock icon of a *bundle*, never of a bare executable, and Finder will not
      # launch a bare one by double-click either. So the microscope ships as `Manic Microbes.app`
      # and mm-cli stays beside it as the plain binary it wants to be.
      #
      # The iconset is emitted by the binary that was just built, so the dock icon and the window
      # icon are the same drawing and cannot drift apart. `iconutil` is preinstalled.
      - name: Wrap the microscope in an app bundle
        if: matrix.name == 'macos-universal'
        run: |
          app="dist/$STAGE_DIR/Manic Microbes.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"

          ./target/release/mm-app --emit-iconset "$RUNNER_TEMP/mm.iconset"
          iconutil -c icns "$RUNNER_TEMP/mm.iconset" -o "$app/Contents/Resources/icon.icns"

          mv "dist/$STAGE_DIR/mm-app" "$app/Contents/MacOS/mm-app"

          # Contents/Resources is the third place `mm_asm::locate` looks — `../Resources` from
          # the executable in Contents/MacOS. A double-clicked bundle gets a working directory of
          # `/`, so without this copy the library is empty however carefully the archive beside
          # it is arranged.
          cp -R scenarios genomes "$app/Contents/Resources/"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Manic Microbes</string>
            <key>CFBundleDisplayName</key><string>Manic Microbes</string>
            <key>CFBundleIdentifier</key><string>com.manicmicrobes.app</string>
            <key>CFBundleVersion</key><string>${{ steps.version.outputs.version }}</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.version.outputs.version }}</string>
            <key>CFBundleExecutable</key><string>mm-app</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          echo "bundle contents:"
          find "$app" -type f | sed 's|^|  |'

      - name: Archive
        run: |
          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            # Git Bash on the Windows runner has no `zip`; it does have 7z.
            if command -v zip >/dev/null 2>&1; then
              zip -qr "$STAGE_DIR.zip" "$STAGE_DIR"
            else
              7z a -bso0 "$STAGE_DIR.zip" "$STAGE_DIR"
            fi
          else
            tar czf "$STAGE_DIR.tar.gz" "$STAGE_DIR"
          fi
          ls -lh "$STAGE_DIR".*

      # An extra Linux asset, beside the tarball rather than instead of it.
      #
      # The reason is the icon, not convenience: Wayland has no per-window icon protocol, so the
      # runtime call that works on X11 does nothing there, and a compositor takes an application's
      # icon from its .desktop file instead. An AppImage carries one. It also gets a menu entry
      # and a single file to double-click.
      #
      # What it does *not* do is make the binary portable across glibc versions — it bundles the
      # application, not the C library, so this runs on the runner's Ubuntu and newer. That is why
      # the tarball stays: this is the convenient one, not the compatible one.
      #
      # No StartupWMClass in the desktop entry. It is the field that ties a running window back to
      # its launcher icon, it has to equal what `xprop WM_CLASS` reports for the window, and a
      # wrong value matches nothing — which is worse than the absence, because the absence lets
      # the desktop fall back to its own heuristics. If the running window ever shows the wrong
      # icon while the menu entry shows the right one, that field is the fix.
      - name: Build an AppImage
        if: matrix.name == 'linux-x86_64'
        run: |
          version="${{ steps.version.outputs.version }}"
          appdir="$RUNNER_TEMP/AppDir"
          id=com.manicmicrobes.ManicMicrobes
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/metainfo"

          cp target/release/mm-app "$appdir/usr/bin/"

          # Beside the binary, because that is the second place `mm_asm::locate` looks and an
          # AppImage launched from a menu has a working directory of wherever the menu was.
          # Without these the scenario library is empty and every genome but the built-in
          # ancestor is unreachable.
          cp -R genomes scenarios "$appdir/usr/bin/"

          # Drawn at each size by the binary that was just built, so the menu icon, the window
          # icon and the .ico are renderings of one drawing rather than copies of each other.
          for size in 64 128 256 512; do
            ./target/release/mm-app --emit-icon "$size" \
              "$appdir/usr/share/icons/hicolor/${size}x${size}/apps/$id.png"
          done
          # appimagetool wants the icon named for the desktop entry at the AppDir root too.
          cp "$appdir/usr/share/icons/hicolor/256x256/apps/$id.png" "$appdir/$id.png"

          # The packaging files rather than a copy written inline here: the desktop entry and the
          # AppStream metadata are the same ones a Flatpak or a .deb will install, they are
          # validated in the repository, and a second copy in this file is a second thing to keep
          # in step. Installed under the application id, which is what every software centre
          # matches on.
          cp packaging/$id.desktop "$appdir/$id.desktop"
          mkdir -p "$appdir/usr/share/applications"
          cp packaging/$id.desktop "$appdir/usr/share/applications/"
          cp packaging/$id.metainfo.xml "$appdir/usr/share/metainfo/"

          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/mm-app" "$@"\n' \
            > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"

          curl -sSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"

          # --appimage-extract-and-run twice over: the runner has no FUSE, so neither appimagetool
          # itself nor anything it produces can be mounted the usual way.
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run \
            "$appdir" "dist/manic-microbes-${version}-linux-x86_64.AppImage"

          ls -lh dist/*.AppImage

      # Named for the thing rather than the platform. The archive inside has
      # always carried the full name, but GitHub wraps an artefact in a zip
      # called whatever this is — so a hand-run build handed you a file called
      # `linux-x86_64.zip` and no clue what was in it.
      - uses: actions/upload-artifact@v7
        with:
          name: manic-microbes-${{ matrix.name }}
          # The AppImage pattern matches nothing on the two platforms that do not build one,
          # which is fine: if-no-files-found fires only when every pattern comes up empty.
          path: |
            dist/*.${{ matrix.archive }}
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Only on a tag. A hand-run build stops at the job above with its archives
  # attached to the run, which is what makes this workflow safe to try out.
  # ---------------------------------------------------------------------------
  release:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.zip ./*.tar.gz ./*.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<NOTES
          Pre-release. There is no stable save format yet, and a slide written by
          one version may not open in the next.

          Each archive holds the microscope and \`mm-cli\`, the headless runner,
          along with the scenarios, the genomes and both licences. Nothing to
          install: unpack it and run it.

          On macOS the microscope is \`Manic Microbes.app\` — double-click it.
          Elsewhere it is \`mm-app\` beside \`mm-cli\`. On Linux there is also an
          \`.AppImage\`: one file, a menu entry, and the only version whose icon
          shows up under Wayland. The tarball is the one to take if your
          distribution is older than Ubuntu 24.04, since an AppImage bundles the
          application and not the C library.

          The headless runner is the same everywhere:

          \`\`\`
          ./mm-cli run scenarios/soup.ron --genome genomes/ancestor.mm --ticks 50000
          \`\`\`

          A scenario seeds the water and the light but puts no cells on the
          slide, so \`--genome\` is what makes it a world rather than an empty jar.

          ### The binaries are not signed

          Signing costs a yearly Apple developer account and a Windows
          certificate, and this is free software written for the interest of it.
          So each platform will ask once:

          - **macOS** — "cannot be opened because the developer cannot be
            verified". Either right-click the app and choose Open, which offers
            the button a double-click does not, or strip the download flag from
            the whole folder: \`xattr -dr com.apple.quarantine
            manic-microbes-${version}-macos-universal\`
          - **Windows** — SmartScreen shows a blue warning. More info → Run
            anyway.
          - **Linux** — \`chmod +x mm-app mm-cli\` if the archive did not keep it.

          Verify what you downloaded against \`SHA256SUMS\` if you would rather
          not take that on trust.

          ### Requirements

          A GPU with Vulkan, Metal or DX12 for the microscope; \`mm-cli\` needs
          none. 4 GB of RAM for a small slide. On Linux, XWayland if you are on
          Wayland.
          NOTES
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          # v0.1.0-rc.1 is a prerelease; v0.1.0 is not.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            $prerelease \
            dist/*.zip dist/*.tar.gz dist/*.AppImage dist/SHA256SUMS
