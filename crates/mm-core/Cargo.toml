[package]
name = "mm-core"
description = "Manic Microbes simulation core. No Bevy, no floats, no wall-clock, no global RNG."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Kept to the minimum that the milestones actually require, and reviewed by
# `tests/hard_rules.rs`: rayon for the fluid solver, serde + ron for scenario files.
# Nothing here can pull in Bevy, floats-as-simulation-state, or a clock.
[dependencies]
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
# A dev-only cycle, which cargo permits: the acceptance tests need to assemble the genomes in
# `genomes/`, and mm-core must not depend on the toolchain in its own right.
mm-asm = { path = "../mm-asm" }

[[bench]]
name = "vm"
harness = false

[[bench]]
name = "fluid"
harness = false

[[bench]]
name = "population"
harness = false

# The route panel: what a tick costs down each path evolution might take, at the slide size the
# product actually runs. See the module docs for why `population.rs` alone is not enough.
[[bench]]
name = "routes"
harness = false
