[package]
name = "mm-app"
description = "Manic Microbes front-end: the microscope, the editor, the wiki."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The microscope is what `cargo run -p mm-app` means. Without this the shader bench makes that
# ambiguous, and the command every doc in the repo gives stops working.
default-run = "mm-app"

[dependencies]
# The per-cell seam solve in `slide::frame`, which is embarrassingly parallel and was five
# times the cost of a whole tick before it was.
rayon = "1.12"
mm-core = { path = "../mm-core" }
mm-asm = { path = "../mm-asm" }

# The only crate in the workspace that may depend on Bevy, and the reason mm-core may not: the
# simulation has to run headless at a thousand times realtime, and a renderer that could hold
# it to a frame budget would make that impossible (SPEC §1).
#
# Optional, so that `slide.rs` — which is where the wall between simulation and rendering
# actually lives — compiles and is tested without a graphics stack. The guarantee M4 has to
# make is that rendering cannot reach the simulation, and that is checkable on a machine with
# no display at all.
bevy = { version = "0.19", optional = true, default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    # Split out of `bevy_sprite` at 0.17: the sprite *renderer*, which is what draws
    # anything, including `Material2d`.
    "bevy_sprite_render",
    # Not for drawing text — egui does its own. `bevy_sprite`'s text2d systems ask for
    # `Assets<Font>` unconditionally at 0.17, and a missing resource is a hard failure now
    # rather than a skipped system.
    "bevy_text",
    "default_font",
    "x11",
    "multi_threaded",
] }
bevy_egui = { version = "0.41", optional = true }

# For `drag_window` and `drag_resize_window` only: a borderless window has no frame for the
# window manager to grab, so moving and resizing are handed to the compositor by hand (M10.9).
# The same version Bevy resolves, so there is one winit in the graph and one `Window` type;
# `bevy_winit` re-exports two items and `ResizeDirection` is not one of them.
winit = { version = "0.30", optional = true }

# The WGSL front-end and validator, for tests only.
#
# A shader is parsed when a *pipeline* is compiled, which is at draw time, on a machine with a
# window — so until now a syntax error in `limb.wgsl` or a type that did not check surfaced as a
# layer that silently did not draw, several minutes and one graphics stack away from the line that
# was wrong. `tests/shader_syntax.rs` does the same parse and the same validation in a second, with
# no display.
#
# **The version has to be the one Bevy resolves** — `cargo tree -i naga` — or the test is checking
# a dialect the renderer does not speak, which is worse than not checking at all.
[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }

[features]
default = []
render = ["dep:bevy", "dep:bevy_egui", "dep:winit"]

[lib]
name = "mm_app"
path = "src/lib.rs"

[[bin]]
name = "mm-app"
path = "src/main.rs"
required-features = ["render"]

# The cell shader with no simulation behind it. See the module docs in `src/bin/shaderbench.rs`
# and `src/phantom.rs`: it draws cells that arithmetic made, through the same shader, material and
# vertex layout the microscope uses, so that "the shader" and "what the shader was given" can be
# told apart without running a world.
[[bin]]
name = "shaderbench"
path = "src/bin/shaderbench.rs"
required-features = ["render"]

# For `threads::pin_to` and nothing else: `sched_setaffinity`, so rayon's workers stay on the
# cores worth having. See that module for what it buys and why it cannot live in `mm-core`,
# which is `#![forbid(unsafe_code)]`.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Puts the mark inside the .exe, which is the only way Explorer will show one for it. Gated on the
# host rather than the target because a build script is compiled for the host; every build that
# matters is native. `build.rs` generates the .ico from `src/icon.rs`, so nothing in the tree is a
# second copy of the mark that could stop matching the first.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
